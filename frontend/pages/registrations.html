<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My registrations · CivicEvents+</title>
  <meta name="description" content="Events you have registered for.">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main id="main">
    <div class="mb-6 flex flex-col gap-4 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="eyebrow">Your plans</p>
        <h1 class="page-title">My registrations</h1>
        <p class="page-subtitle">Manage the events you are attending.</p>
      </div>
      <a href="events.html" class="btn-primary"><span data-icon="search"></span>Find more events</a>
    </div>
    <div class="mb-5 flex flex-wrap gap-2" role="tablist" aria-label="Registration status" id="tabs">
      <button type="button" role="tab" class="btn-sm btn" data-tab="upcoming" id="tab-upcoming" aria-controls="registrations-list">Upcoming</button>
      <button type="button" role="tab" class="btn-sm btn" data-tab="past" id="tab-past" aria-controls="registrations-list">Past</button>
      <button type="button" role="tab" class="btn-sm btn" data-tab="cancelled" id="tab-cancelled" aria-controls="registrations-list">Cancelled</button>
    </div>
    <div id="registrations-list" role="tabpanel" tabindex="0" aria-live="polite" aria-busy="true"></div>
  </main>

  <script src="../js/vendor/jquery.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/media.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/registrations.js"></script>
</body>
</html>
