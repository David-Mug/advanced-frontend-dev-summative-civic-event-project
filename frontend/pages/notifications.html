<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · CivicEvents+</title>
  <meta name="description" content="Your notifications inbox.">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main id="main">
    <div class="mb-6 flex flex-col gap-4 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="eyebrow">Inbox</p>
        <h1 class="page-title">Notifications</h1>
        <p class="page-subtitle">Updates about new events, announcements and promos.</p>
      </div>
      <div class="flex gap-2"><button type="button" class="btn-outline" id="refresh"><span data-icon="refresh"></span>Refresh</button><button type="button" class="btn-primary" id="mark-all"><span data-icon="check"></span>Mark all as read</button></div>
    </div>
    <div class="mb-5 flex flex-wrap gap-2" role="group" aria-label="Filter notifications" id="filters"></div>
    <section class="card p-2 sm:p-3" aria-labelledby="inbox-title">
      <h2 id="inbox-title" class="sr-only">Notification list</h2>
      <div id="notifications-list" aria-live="polite" aria-busy="true"></div>
    </section>
    <nav id="pagination" class="mt-6"></nav>
  </main>

  <script src="../js/vendor/jquery.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/media.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/notifications-page.js"></script>
</body>
</html>
