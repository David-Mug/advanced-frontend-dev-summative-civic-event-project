<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcements · CivicEvents+</title>
  <meta name="description" content="Listen to official audio announcements.">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=7">
</head>
<body>
  <main id="main">
    <div class="mb-6 flex flex-col gap-4 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="eyebrow">Listen</p>
        <h1 class="page-title">Announcements</h1>
        <p class="page-subtitle">Official audio updates from your local leaders.</p>
      </div>
      <a href="admin-announcements.html" class="btn-primary" data-admin-only hidden><span data-icon="megaphone"></span>Manage announcements</a>
    </div>
    <div class="mb-6 max-w-md">
      <label for="q" class="form-label">Search announcements</label>
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-ink-muted" data-icon="search"></span>
        <input id="q" type="search" class="form-input pl-10" placeholder="Search by title" autocomplete="off">
      </div>
      <p id="results-count" class="mt-2 text-sm text-ink-soft" role="status" aria-live="polite"></p>
    </div>
    <div id="announcements-grid" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" aria-busy="true"></div>
    <nav id="pagination" class="mt-8"></nav>
  </main>

  <script src="../js/vendor/jquery.min.js?v=7"></script>
  <script src="../js/config.js?v=7"></script>
  <script src="../js/utils.js?v=7"></script>
  <script src="../js/icons.js?v=7"></script>
  <script src="../js/auth.js?v=7"></script>
  <script src="../js/api.js?v=7"></script>
  <script src="../js/ui.js?v=7"></script>
  <script src="../js/validation.js?v=7"></script>
  <script src="../js/notifications.js?v=7"></script>
  <script src="../js/layout.js?v=7"></script>
  <script src="../js/media.js?v=7"></script>
  <script src="../js/components.js?v=7"></script>
  <script src="../js/pages/announcements.js?v=7"></script>

</html>
