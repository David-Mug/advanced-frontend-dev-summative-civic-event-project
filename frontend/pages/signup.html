<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · CivicEvents+</title>
  <meta name="description" content="Create a free CivicEvents+ account to take part in civic life.">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=7">
</head>
<body class="bg-white">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div class="grid min-h-screen lg:grid-cols-2">
    <aside class="relative hidden overflow-hidden bg-gradient-to-br from-brand-strong to-brand-deep p-12 text-white lg:flex lg:flex-col lg:justify-between" aria-hidden="true">
      <div class="relative flex items-center gap-3" data-brand-light></div>
      <div class="relative max-w-md">
        <h2 class="font-heading text-4xl font-extrabold leading-tight text-white">Be part of what happens next.</h2>
        <ul class="mt-6 space-y-3 text-lg text-white">
          <li class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full bg-accent"></span> Register for civic events</li>
          <li class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full bg-accent"></span> Hear official announcements</li>
          <li class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full bg-accent"></span> Rate events and share feedback</li>
        </ul>
      </div>
      <p class="relative text-sm text-white">Accessible · Transparent · Community-first</p>
    </aside>

    <main id="main" tabindex="-1" class="relative flex items-center justify-center overflow-hidden bg-brand-light px-4 py-12 sm:px-8">
      <div class="logo-pattern" aria-hidden="true"></div>
      <div class="relative w-full max-w-md">
        <a href="../index.html" class="mb-8 flex w-fit items-center gap-2.5 rounded-xl bg-brand-light py-1 pr-3 no-underline lg:hidden" data-brand aria-label="CivicEvents+ home"></a>
        <div class="card p-6 sm:p-8">
          <h1 class="font-heading text-2xl font-extrabold">Create your account</h1>
          <p class="mt-1 text-sm text-ink-soft">Already registered? <a href="login.html" class="font-semibold">Sign in</a></p>

          <form id="signup-form" class="mt-6 space-y-5" novalidate>
            <div data-form-alert aria-live="assertive"></div>
            <div>
              <label for="full_name" class="form-label">Full name</label>
              <input id="full_name" name="full_name" type="text" class="form-input" autocomplete="name" required maxlength="255">
            </div>
            <div>
              <label for="email" class="form-label">Email address</label>
              <input id="email" name="email" type="email" class="form-input" autocomplete="email" inputmode="email" required>
            </div>
            <div>
              <label for="password" class="form-label">Password</label>
              <div class="input-group" data-field>
                <input id="password" name="password" type="password" class="form-input" autocomplete="new-password" required aria-describedby="password-rules">
                <button type="button" class="input-addon" data-toggle-password="password"></button>
              </div>
              <div class="mt-3" aria-hidden="true">
                <div class="flex gap-1.5" data-strength-bars>
                  <span class="h-1.5 flex-1 rounded-full bg-slate-200"></span><span class="h-1.5 flex-1 rounded-full bg-slate-200"></span><span class="h-1.5 flex-1 rounded-full bg-slate-200"></span><span class="h-1.5 flex-1 rounded-full bg-slate-200"></span>
                </div>
              </div>
              <p class="mt-1.5 text-xs font-semibold text-ink-soft" data-strength-label aria-live="polite"></p>
              <ul id="password-rules" class="mt-2 grid grid-cols-1 gap-1 text-xs sm:grid-cols-2" data-rules></ul>
            </div>
            <div>
              <label for="confirm_password" class="form-label">Confirm password</label>
              <div class="input-group" data-field>
                <input id="confirm_password" name="confirm_password" type="password" class="form-input" autocomplete="new-password" required>
                <button type="button" class="input-addon" data-toggle-password="confirm_password"></button>
              </div>
            </div>
            <button type="submit" class="btn-primary w-full">Create account</button>
          </form>
        </div>
        <p class="mt-6 text-center text-sm text-ink-soft"><a href="../index.html">← Back to home</a></p>
      </div>
    </main>
  </div>

  <script src="../js/vendor/jquery.min.js?v=7"></script>
  <script src="../js/config.js?v=7"></script>
  <script src="../js/utils.js?v=7"></script>
  <script src="../js/icons.js?v=7"></script>
  <script src="../js/auth.js?v=7"></script>
  <script src="../js/api.js?v=7"></script>
  <script src="../js/ui.js?v=7"></script>
  <script src="../js/validation.js?v=7"></script>
  <script src="../js/pages/auth-pages.js?v=7"></script>
</body>
</html>
