<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage announcements · CivicEvents+</title>
  <meta name="description" content="Upload and publish audio announcements.">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=7">
</head>
<body>
  <main id="main">
    <div class="mb-6 flex flex-col gap-4 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="eyebrow">Administration</p>
        <h1 class="page-title">Announcements management</h1>
        <p class="page-subtitle">Upload audio, publish or unpublish, and edit titles.</p>
      </div>
      <button type="button" class="btn-primary" id="create-btn"><span data-icon="plus"></span>New announcement</button>
    </div>
    <section class="card overflow-hidden" aria-labelledby="table-title">
      <div class="flex flex-col gap-3 border-b border-line p-4 sm:flex-row sm:items-end sm:justify-between">
        <h2 id="table-title" class="sr-only">Announcements table</h2>
        <div class="w-full sm:max-w-xs">
          <label for="q" class="form-label">Search</label>
          <input id="q" type="search" class="form-input" placeholder="Search by title" autocomplete="off">
        </div>
        <div class="w-full sm:w-48">
          <label for="status-filter" class="form-label">Status</label>
          <select id="status-filter" class="form-input"><option value="all">All</option><option value="published">Published</option><option value="draft">Drafts</option></select>
        </div>
      </div>
      <div id="table-host" class="table-wrap"></div>
    </section>
    <p id="results-count" class="mt-3 text-sm text-ink-soft" role="status" aria-live="polite"></p>
  </main>

  <script src="../js/vendor/jquery.min.js?v=7"></script>
  <script src="../js/config.js?v=7"></script>
  <script src="../js/utils.js?v=7"></script>
  <script src="../js/icons.js?v=7"></script>
  <script src="../js/auth.js?v=7"></script>
  <script src="../js/api.js?v=7"></script>
  <script src="../js/ui.js?v=7"></script>
  <script src="../js/validation.js?v=7"></script>
  <script src="../js/notifications.js?v=7"></script>
  <script src="../js/layout.js?v=7"></script>
  <script src="../js/media.js?v=7"></script>
  <script src="../js/components.js?v=7"></script>
  <script src="../js/pages/admin-announcements.js?v=7"></script>
</body>
</html>
