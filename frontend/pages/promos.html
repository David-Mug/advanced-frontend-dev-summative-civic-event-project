<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promos · CivicEvents+</title>
  <meta name="description" content="Watch promotional videos about community initiatives.">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main id="main">
    <div class="mb-6 flex flex-col gap-4 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="eyebrow">Watch</p>
        <h1 class="page-title">Promos</h1>
        <p class="page-subtitle">Short, captioned videos about initiatives in your community.</p>
      </div>
      <a href="admin-promos.html" class="btn-primary" data-admin-only hidden><span data-icon="film"></span>Manage promos</a>
    </div>
    <div class="mb-6 max-w-md">
      <label for="q" class="form-label">Search promos</label>
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-ink-muted" data-icon="search"></span>
        <input id="q" type="search" class="form-input pl-10" placeholder="Search by title or description" autocomplete="off">
      </div>
      <p id="results-count" class="mt-2 text-sm text-ink-soft" role="status" aria-live="polite"></p>
    </div>
    <div id="promos-grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true"></div>
    <nav id="pagination" class="mt-8"></nav>
  </main>

  <script src="../js/vendor/jquery.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/media.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/promos.js"></script>
</body>
</html>
