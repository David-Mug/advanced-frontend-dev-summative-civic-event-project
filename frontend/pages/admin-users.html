<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage users · CivicEvents+</title>
  <meta name="description" content="View and enable or disable user accounts.">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=7">
</head>
<body>
  <main id="main">
    <div class="mb-6 flex flex-col gap-4 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="eyebrow">Administration</p>
        <h1 class="page-title">User management</h1>
        <p class="page-subtitle">View accounts and enable or disable access. Roles cannot be changed here.</p>
      </div>
      
    </div>
    <section aria-labelledby="user-stats-title" class="mb-6">
      <h2 id="user-stats-title" class="sr-only">User totals</h2>
      <div id="user-stats" class="grid grid-cols-2 gap-4 lg:grid-cols-4"></div>
    </section>
    <section class="card overflow-hidden" aria-labelledby="table-title">
      <div class="flex flex-col gap-3 border-b border-line p-4 md:flex-row md:items-end">
        <h2 id="table-title" class="sr-only">Users table</h2>
        <div class="w-full md:max-w-xs">
          <label for="q" class="form-label">Search</label>
          <input id="q" type="search" class="form-input" placeholder="Name or email" autocomplete="off">
        </div>
        <div class="w-full md:w-40">
          <label for="role-filter" class="form-label">Role</label>
          <select id="role-filter" class="form-input"><option value="all">All roles</option><option value="admin">Admin</option><option value="user">User</option></select>
        </div>
        <div class="w-full md:w-40">
          <label for="status-filter" class="form-label">Status</label>
          <select id="status-filter" class="form-input"><option value="all">Any status</option><option value="active">Active</option><option value="disabled">Disabled</option></select>
        </div>
      </div>
      <div id="table-host" class="table-wrap"></div>
    </section>
    <p id="results-count" class="mt-3 text-sm text-ink-soft" role="status" aria-live="polite"></p>
    <nav id="pagination" class="mt-6"></nav>
  </main>

  <script src="../js/vendor/jquery.min.js?v=7"></script>
  <script src="../js/config.js?v=7"></script>
  <script src="../js/utils.js?v=7"></script>
  <script src="../js/icons.js?v=7"></script>
  <script src="../js/auth.js?v=7"></script>
  <script src="../js/api.js?v=7"></script>
  <script src="../js/ui.js?v=7"></script>
  <script src="../js/validation.js?v=7"></script>
  <script src="../js/notifications.js?v=7"></script>
  <script src="../js/layout.js?v=7"></script>
  <script src="../js/media.js?v=7"></script>
  <script src="../js/components.js?v=7"></script>
  <script src="../js/pages/admin-users.js?v=7"></script>
</body>
</html>
